name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all unit tests
        run: |
          for f in tests/test_*.py; do
            echo "== $f =="
            python "$f" || exit 1
          done
      - name: Compile check
        run: python -m py_compile app.py rxbondhu/*.py tools/evaluate_handwritten.py
